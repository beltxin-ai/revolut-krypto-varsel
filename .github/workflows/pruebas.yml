name: Pruebas

# Se ejecuta con cada cambio del código: si algo se rompe, se ve aquí antes de que afecte al radar.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar
        run: python -m py_compile *.py
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
