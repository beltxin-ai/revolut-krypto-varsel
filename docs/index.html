<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Revolut X</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar X">
<style>
:root{--bg:#f5f5f3;--card:#fff;--tx:#18181b;--mut:#6b6b70;--ln:#e5e4e0;--up:#0e8a5a;--dn:#c2410c;--acc:#3b5bdb;--am:#a16207;
--gbg:#dcf3e8;--ybg:#fef3c7;--rbg:#fde7df;--bbg:#e0e7ff;--nbg:#efefec}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--card:#1b1b1e;--tx:#ececec;--mut:#9b9ba1;--ln:#2e2e33;--up:#34d399;--dn:#fb923c;--acc:#8ea2ff;--am:#fcd34d;
--gbg:#10301f;--ybg:#3a2f10;--rbg:#3b1d12;--bbg:#1e2550;--nbg:#26262a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:1100px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}h3{font-size:12px;margin:16px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut)}.sm{font-size:12px}.up{color:var(--up)}.dn{color:var(--dn)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv{border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:11px;color:var(--mut)}.kv b{font-variant-numeric:tabular-nums;font-size:15px}
.banner{border-radius:12px;padding:14px;margin:10px 0}
.banner .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.banner .v{font-size:22px;font-weight:800}
.g{background:var(--gbg)}.r{background:var(--rbg)}.y{background:var(--ybg)}.b2{background:var(--bbg)}.n{background:var(--nbg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:14px 0 12px;overflow-x:auto}
.tabs button{font:inherit;border:0;background:none;color:var(--mut);padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--acc);font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-weight:500;color:var(--mut);font-size:12px;cursor:pointer;user-select:none}
tbody tr[data-t]{cursor:pointer}tbody tr[data-t]:hover td{background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.b{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pos{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.pos:last-child{border-bottom:0}
#det{display:none}#det.on{display:block}
svg.ch{width:100%;height:220px;display:block}
.btn{font:inherit;font-size:13px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.note{font-size:12px;color:var(--mut);margin-top:8px}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);max-width:220px;width:100%}
ol,ul{padding-left:20px}li{margin:4px 0}
</style>
</head>
<body>
<main>
  <div class="row sp"><h1>Radar Revolut X</h1><span class="mut sm" id="st">Cargando…</span></div>
  <div id="reg"></div>
  <section class="card" id="det" aria-live="polite"></section>
  <section class="card" id="hoy"></section>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="cartera">Cartera modelo</button>
    <button role="tab" aria-selected="false" data-tab="vigilar">Vigilar</button>
    <button role="tab" aria-selected="false" data-tab="universo">Universo</button>
    <button role="tab" aria-selected="false" data-tab="evidencia">Evidencia</button>
    <button role="tab" aria-selected="false" data-tab="metodo">Método y límites</button>
  </div>
  <section id="tab-cartera" class="card"></section>
  <section id="tab-vigilar" class="card" hidden></section>
  <section id="tab-universo" class="card" hidden>
    <div class="row sp" style="margin-bottom:8px"><input type="search" id="q" placeholder="Buscar…" aria-label="Buscar moneda"><span class="sm mut" id="un"></span></div>
    <div class="tw"><table><thead><tr>
      <th data-k="ticker">Moneda</th><th data-k="precio">Precio</th><th data-k="cambio_24h">24 h</th><th data-k="tendencia">Tendencia</th>
      <th data-k="dist_max55">vs máx. 55 d</th><th data-k="atr_pct">ATR diario</th><th data-k="spread">Spread</th><th data-k="vol_usd">Vol. 24 h</th>
    </tr></thead><tbody id="tb"></tbody></table></div>
  </section>
  <section id="tab-evidencia" class="card" hidden></section>
  <section id="tab-metodo" class="card" hidden></section>
  <p class="note">Herramienta de análisis, no asesoramiento financiero. Los resultados pasados, incluso fuera de muestra, no garantizan resultados futuros.</p>
</main>
<script>
const $ = s => document.querySelector(s);
const OWN = location.hostname.split('.')[0], REPO = location.pathname.split('/').filter(Boolean)[0] || 'revolut-krypto-varsel';
const RAW = b => location.hostname.endsWith('github.io') ? `https://raw.githubusercontent.com/${OWN}/${REPO}/${b}/` : '';
let D = null, E = null, sortK = 'vol_usd', asc = false, activa = null;
const esn = (x, d = 2) => x == null || isNaN(x) ? '–' : (Math.abs(x) >= 0.01 || x === 0) ? x.toLocaleString('es-ES', {minimumFractionDigits: d, maximumFractionDigits: d}) : Number(x).toPrecision(3).replace('.', ',');
const usd = x => x == null ? '–' : (Math.abs(x) >= 1 ? esn(x, 2) : Number(x).toPrecision(4).replace('.', ',')) + ' $';
const pc = (x, d = 1, col = true) => x == null ? '<span class="mut">–</span>' : `<span class="${col ? (x >= 0 ? 'up' : 'dn') : ''}">${x >= 0 && col ? '+' : ''}${esn(x * 100, d)} %</span>`;
const big = x => x == null ? '–' : x >= 1e6 ? esn(x / 1e6, 1) + ' M$' : esn(x / 1e3, 0) + ' k$';
const hora = t => new Date(t * 1000).toLocaleString('es-ES', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

async function cargar() {
  try { D = await fetch(RAW('data') + 'radar.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()); }
  catch (e) { $('#st').textContent = 'Aún no hay datos. Vuelve en unos minutos.'; return; }
  if (!E) try { E = await fetch(RAW('investigacion') + 'resultados.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()); } catch (e) {}
  const min = Math.round((Date.now() / 1000 - D.actualizado) / 60);
  $('#st').innerHTML = `Actualizado hace ${min} min · último cierre diario ${esc(D.ult_cierre)}` + (min > 40 ? ' · <b class="dn">datos atrasados</b>' : '');
  regimen(); hoy(); cartera(); vigilar(); universo(); evidencia(); metodo();
  const q = new URLSearchParams(location.search).get('moneda');
  if (activa) abrir(activa, true); else if (q) abrir(q);
}

function regimen() {
  const r = D.regimen;
  $('#reg').innerHTML = `<div class="banner ${r.alcista ? 'g' : 'r'}"><div class="l">Régimen de mercado</div>
    <div class="v">${r.alcista ? 'Alcista: se permiten entradas en altcoins' : 'Bajista: no se abren altcoins nuevas'}</div>
    <div class="sm">BTC ${usd(r.btc)} · ${pc(r.distancia)} frente a su media de 200 días (${usd(r.sma200)})</div></div>`;
}

function hoy() {
  const ev = D.eventos || [], ca = D.candidatas_hoy || [], c = D.cartera;
  const ocupadas = c.satelite.length, libres = D.sistema.max_satelite - ocupadas;
  $('#hoy').innerHTML = `<h2>Qué hacer ahora</h2>
    ${ev.length ? `<p><b>Señales de esta revisión:</b> ${ev.map(e => `${e.tipo === 'entrada' ? '🟢 comprar' : e.tipo === 'stop' ? '🔴 stop' : '🔴 vender'} <a href="#" data-t="${esc(e.ticker)}">${esc(e.ticker)}</a>`).join(' · ')}</p>` : '<p class="mut">Sin órdenes nuevas en esta revisión. Mantén lo que indica la cartera modelo.</p>'}
    <div class="grid">
      <div class="kv"><span>Núcleo (BTC/ETH)</span><b>${c.nucleo.length ? c.nucleo.map(p => p.ticker).join(' + ') : 'fuera'}</b></div>
      <div class="kv"><span>Satélite</span><b>${ocupadas}/${D.sistema.max_satelite} posiciones</b></div>
      <div class="kv"><span>Liquidez</span><b>${esn(c.caja * 100, 0)} %</b></div>
      <div class="kv"><span>Cartera modelo</span><b>${pc(c.resumen.rentabilidad)}</b></div>
    </div>
    ${ca.length && (!D.regimen.alcista || libres <= 0) ? `<p class="note">Hoy rompen su máximo de 55 días ${ca.map(x => esc(x.ticker)).join(', ')}, pero no se compran: ${!D.regimen.alcista ? 'el régimen es bajista' : 'no quedan huecos en el satélite'}.</p>` : ''}`;
}

function filaPos(p, bloque) {
  const ret = p.ultimo && p.entrada ? p.ultimo * (1 - 0.0009) / p.entrada - 1 : null;
  return `<div class="pos" data-t="${esc(p.ticker)}"><div><b>${esc(p.ticker)}</b> <span class="sm mut">${bloque} · ${esn(p.peso * 100, 0)} % · desde ${hora(p.t)}</span>
    <div class="sm mut">Entrada ${usd(p.entrada)}${p.stop ? ` · stop ${usd(p.stop)}` : ' · sale si se rompe la tendencia'}</div></div>
    <div style="text-align:right"><b>${pc(ret)}</b><div class="sm mut">${usd(p.ultimo)}</div></div></div>`;
}

function curvaSVG(curva) {
  if (!curva || curva.length < 2) return '<p class="mut">La curva aparece tras varios cierres diarios.</p>';
  const W = 800, H = 180, P = 6, n = curva.length;
  const v = curva.map(x => x[1]), b0 = curva[0][2], b = curva.map(x => b0 && x[2] ? x[2] / b0 : null);
  const all = v.concat(b.filter(x => x)), lo = Math.min(...all), hi = Math.max(...all);
  const X = i => P + i / (n - 1) * (W - 2 * P), Y = y => H - P - (y - lo) / ((hi - lo) || 1) * (H - 2 * P);
  const r = a => a.map((y, i) => y == null ? '' : `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(y).toFixed(1)}`).join(' ');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Curva de la cartera modelo frente a BTC">
    <path d="${r(b)}" fill="none" stroke="var(--am)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <path d="${r(v)}" fill="none" stroke="var(--acc)" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>
    <div class="row sm mut"><span style="color:var(--acc)">— Cartera modelo</span><span style="color:var(--am)">— BTC</span></div>`;
}

function cartera() {
  const c = D.cartera, r = c.resumen;
  $('#tab-cartera').innerHTML = `<h2>Cartera modelo (seguimiento real)</h2>
    <p class="note" style="margin-top:0">Ejecuta el sistema con precios reales de Revolut X: compra al ask, vende al bid y paga 0,09 % de comisión. Empezó el ${hora(r.desde)}.</p>
    <div class="grid">
      <div class="kv"><span>Rentabilidad</span><b>${pc(r.rentabilidad)}</b></div>
      <div class="kv"><span>BTC en el mismo periodo</span><b>${pc(r.btc_desde)}</b></div>
      <div class="kv"><span>Operaciones cerradas</span><b>${r.operaciones}</b></div>
      <div class="kv"><span>Aciertos</span><b>${r.aciertos == null ? '–' : esn(r.aciertos * 100, 0) + ' %'}</b></div>
      <div class="kv"><span>Media por operación</span><b>${r.media == null ? '–' : pc(r.media, 2)}</b></div>
      <div class="kv"><span>Profit factor</span><b>${r.profit_factor == null ? '–' : esn(r.profit_factor, 2)}</b></div>
    </div>
    <h3>Posiciones abiertas</h3>
    ${c.nucleo.map(p => filaPos(p, 'Núcleo')).join('') + c.satelite.map(p => filaPos(p, 'Satélite')).join('') || '<p class="mut">Ninguna. La cartera está en liquidez.</p>'}
    <h3>Evolución</h3>${curvaSVG(c.curva)}
    <h3>Operaciones cerradas</h3>
    <div class="tw"><table><thead><tr><th>Moneda</th><th>Sistema</th><th>Entrada</th><th>Salida</th><th>Motivo</th><th>Neto</th></tr></thead><tbody>
    ${(c.cerradas || []).map(p => `<tr data-t="${esc(p.ticker)}"><td><b>${esc(p.ticker)}</b></td><td>${esc(p.sistema)}</td><td>${hora(p.t)} · ${usd(p.entrada)}</td><td>${hora(p.t_salida)} · ${usd(p.salida)}</td><td style="text-align:left">${esc(p.motivo)}</td><td>${pc(p.ret, 2)}</td></tr>`).join('') || '<tr><td colspan="6" class="mut">Aún no hay operaciones cerradas.</td></tr>'}
    </tbody></table></div>`;
}

function vigilar() {
  const ca = D.candidatas_hoy || [], ce = D.cerca_de_ruptura || [];
  const fila = x => `<tr data-t="${esc(x.ticker)}"><td><b>${esc(x.ticker)}</b></td><td>${usd(x.precio ?? x.cierre)}</td><td>${pc(x.dist_max55 ?? (x.fuerza - 1))}</td><td>${x.atr_pct != null ? esn(x.atr_pct * 100, 1) + ' %' : '–'}</td><td>${x.spread != null ? esn(x.spread * 100, 2) + ' %' : '–'}</td></tr>`;
  const byT = t => D.filas.find(f => f.ticker === t) || {};
  $('#tab-vigilar').innerHTML = `<h2>Rompen hoy su máximo de 55 días</h2>
    <div class="tw"><table><thead><tr><th>Moneda</th><th>Precio</th><th>Sobre el máximo</th><th>ATR diario</th><th>Spread</th></tr></thead><tbody>
    ${ca.map(x => fila({...byT(x.ticker), ...x, dist_max55: x.fuerza - 1})).join('') || '<tr><td colspan="5" class="mut">Ninguna.</td></tr>'}</tbody></table></div>
    <h2 style="margin-top:16px">A menos de un 5 % de romper</h2>
    <div class="tw"><table><thead><tr><th>Moneda</th><th>Precio</th><th>Distancia</th><th>ATR diario</th><th>Spread</th></tr></thead><tbody>
    ${ce.map(fila).join('') || '<tr><td colspan="5" class="mut">Ninguna.</td></tr>'}</tbody></table></div>
    <p class="note">La compra solo se confirma al cierre diario (00:00 UTC = 02:00 en Noruega en verano). Una ruptura durante el día puede deshacerse antes del cierre.</p>`;
}

function universo() {
  const q = $('#q').value.trim().toUpperCase();
  const f = D.filas.filter(x => !q || x.ticker.includes(q)).sort((a, b) => {
    let x = a[sortK], y = b[sortK];
    if (typeof x === 'string' || typeof y === 'string') return asc ? String(x).localeCompare(y) : String(y).localeCompare(x);
    x = x ?? -1e18; y = y ?? -1e18; return asc ? x - y : y - x; });
  $('#un').textContent = `${D.universo_n} pares USD con volumen ≥ ${big(D.filtros.min_vol_usd)} y spread ≤ ${esn(D.filtros.max_spread * 100, 1)} %`;
  $('#tb').innerHTML = f.map(x => `<tr data-t="${esc(x.ticker)}"><td><b>${esc(x.ticker)}</b>${x.en_cartera ? ' <span class="up">●</span>' : ''}</td>
    <td>${usd(x.precio)}</td><td>${pc(x.cambio_24h)}</td>
    <td><span class="b ${x.tendencia === 'alcista' ? 'g up' : x.tendencia === 'bajista' ? 'r dn' : 'n mut'}">${esc(x.tendencia)}</span></td>
    <td>${pc(x.dist_max55)}</td><td>${x.atr_pct != null ? esn(x.atr_pct * 100, 1) + ' %' : '–'}</td>
    <td>${x.spread != null ? esn(x.spread * 100, 2) + ' %' : '–'}</td><td>${big(x.vol_usd)}</td></tr>`).join('');
}

function evidencia() {
  if (!E) { $('#tab-evidencia').innerHTML = '<p class="mut">Sin resultados de investigación.</p>'; return; }
  const cel = (x, k, pct = true) => x[k] == null ? '–' : pct ? pc(x[k], 0) : esn(x[k], 2);
  const elegidas = ['Tendencia BTC+ETH (SMA50>SMA200)', 'Ruptura Donchian 55/20 días + filtro BTC'];
  const rows = E.resultados.map(r => `<tr${elegidas.includes(r.nombre) ? ' style="font-weight:700"' : ''}><td style="text-align:left;white-space:normal;min-width:180px">${esc(r.nombre)}</td>
    <td>${cel(r.entrenamiento, 'sharpe', false)}</td><td>${cel(r.fuera_de_muestra, 'cagr')}</td><td>${cel(r.fuera_de_muestra, 'sharpe', false)}</td>
    <td>${cel(r.fuera_de_muestra, 'max_dd')}</td><td>${r.fuera_de_muestra.operaciones || '–'}</td><td>${cel(r.fuera_de_muestra, 'profit_factor', false)}</td></tr>`).join('');
  const a = E.estrategia_actual_4h || {};
  $('#tab-evidencia').innerHTML = `<h2>Por qué este sistema</h2>
    <p>Se probaron 12 variantes fijadas de antemano y 3 referencias sobre ${E.universo.n} monedas líquidas de Revolut X, con costes reales (comisión 0,09 % + medio spread del par + 0,05 % de deslizamiento por operación). Los parámetros se eligieron con el periodo de entrenamiento (${esc(E.periodos.entrenamiento.join(' → '))}) y se midieron en un periodo que no se tocó (${esc(E.periodos.fuera_de_muestra.join(' → '))}).</p>
    <div class="tw"><table><thead><tr><th>Estrategia</th><th>Sharpe entren.</th><th>Rent. anual fuera</th><th>Sharpe fuera</th><th>Caída máx. fuera</th><th>Ops fuera</th><th>PF fuera</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">En negrita, las dos piezas del sistema. La estrategia anterior de 4 h, con costes reales: ${a.operaciones} operaciones, ${a.aciertos != null ? esn(a.aciertos * 100, 0) : '–'} % de aciertos y ${a.media != null ? pc(a.media, 2) : '–'} por operación. Perdía dinero y se ha retirado.</p>
    <h3>Lo que la evidencia NO dice</h3>
    <ul>
      <li>Hay <b>sesgo de supervivencia</b>: solo se probaron monedas que hoy siguen vivas y líquidas. Las que murieron habrían empeorado los resultados.</li>
      <li>Son unos 5 años con un único gran mercado bajista (2022). Es poca muestra para un sistema de tendencia.</li>
      <li>Las caídas máximas son grandes (−26 % el núcleo, −46 % el satélite). Solo sirve si aguantas eso sin abandonar el sistema.</li>
      <li>El spread de hoy se usó para todo el periodo; en momentos de pánico suele ser mayor.</li>
    </ul>`;
}

function metodo() {
  const s = D.sistema, f = D.fuentes;
  $('#tab-metodo').innerHTML = `<h2>Reglas</h2>
    <p><b>Núcleo (${esn(s.peso_nucleo * 200, 0)} % del capital):</b> BTC y ETH, ${esn(s.peso_nucleo * 100, 0)} % cada una. Se tiene cuando el cierre diario está por encima de la media de 50 días y esta por encima de la de 200. Si no, liquidez.</p>
    <p><b>Satélite (${esn(s.peso_satelite * s.max_satelite * 100, 0)} %):</b> hasta ${s.max_satelite} altcoins de ${esn(s.peso_satelite * 100, 0)} % cada una. Entrada cuando el cierre diario supera el máximo de ${s.entrada} días y BTC está sobre su media de 200 días. Stop inicial a ${s.stop_atr} ATR, que sube con el máximo (trailing de ${s.trail_atr} ATR). Salida si el cierre cae bajo el mínimo de ${s.salida} días o si toca el stop.</p>
    <p><b>Frecuencia:</b> las decisiones se toman con la vela diaria cerrada (00:00 UTC). La revisión cada 15 minutos sirve para vigilar los stops con el precio vivo de Revolut X. Espera pocas operaciones: en el periodo de prueba, unas 3 al mes en el satélite y unas 9 al año en el núcleo.</p>
    <h2 style="margin-top:14px">Cómo operarlo en Revolut X</h2>
    <ol>
      <li>Decide qué parte de tu dinero es «capital de trading». Los porcentajes se refieren a esa cantidad.</li>
      <li>Usa <b>órdenes limitadas</b> al precio de compra (bid) o cerca: comisión maker 0 % y evitas pagar el spread.</li>
      <li>Coloca el stop en Revolut X si el par lo permite; si no, la notificación de stop es tu aviso para vender.</li>
      <li>No te saltes señales: el resultado del sistema depende de las pocas operaciones que ganan mucho.</li>
    </ol>
    <h2 style="margin-top:14px">Fuentes</h2>
    <div class="tw"><table><tbody>${Object.entries(f).map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td style="text-align:left" class="${String(v).startsWith('OK') ? 'up' : 'dn'}">${esc(v)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Precios, spread y volumen: API pública de Revolut X (región EEA). Velas diarias: Binance, aceptadas solo si su precio en vivo difiere menos de un 3 % del de Revolut X. Tiempo del último análisis: ${D.duracion_s} s.</p>`;
}

function grafica(g) {
  if (!g || !g.c || g.c.length < 5) return '<p class="mut">Sin gráfica.</p>';
  const W = 800, H = 220, P = 6, n = g.c.length;
  const all = g.c.concat(g.sma50.filter(x => x), g.max55.filter(x => x), g.min20.filter(x => x));
  const lo = Math.min(...all), hi = Math.max(...all);
  const X = i => P + i / (n - 1) * (W - 2 * P), Y = v => H - P - (v - lo) / ((hi - lo) || 1) * (H - 2 * P);
  const r = a => a.map((v, i) => v == null ? '' : `${(i && a[i - 1] != null) ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gráfica diaria">
    <path d="${r(g.max55)}" fill="none" stroke="var(--up)" stroke-dasharray="4 4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <path d="${r(g.min20)}" fill="none" stroke="var(--dn)" stroke-dasharray="4 4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <path d="${r(g.sma50)}" fill="none" stroke="var(--am)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <path d="${r(g.c)}" fill="none" stroke="var(--tx)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="row sm mut"><span>— Cierre diario</span><span style="color:var(--am)">— SMA50</span><span style="color:var(--up)">- - Máx. 55 d</span><span style="color:var(--dn)">- - Mín. 20 d</span></div>`;
}

function abrir(t, silencioso) {
  const x = D.filas.find(f => f.ticker === t);
  if (!x) return;
  activa = t;
  history.replaceState(null, '', '?moneda=' + encodeURIComponent(t));
  const p = D.cartera.nucleo.concat(D.cartera.satelite).find(q => q.ticker === t);
  const cand = (D.candidatas_hoy || []).find(q => q.ticker === t);
  let estado, clase;
  if (p) { estado = `En cartera (${p.sistema})`; clase = 'b2'; }
  else if (x.nucleo) { estado = x.tendencia === 'alcista' ? 'Tendencia alcista' : 'Fuera: sin tendencia alcista'; clase = x.tendencia === 'alcista' ? 'g' : 'n'; }
  else if (cand) { estado = D.regimen.alcista ? 'Ruptura hoy' : 'Ruptura hoy, bloqueada por régimen bajista'; clase = D.regimen.alcista ? 'g' : 'y'; }
  else { estado = x.dist_max55 != null && x.dist_max55 > -0.05 ? 'Cerca de ruptura' : 'Sin señal'; clase = x.dist_max55 > -0.05 ? 'y' : 'n'; }
  $('#det').innerHTML = `<div class="row sp"><div><h2 style="font-size:24px;margin:0">${esc(t)}</h2><div class="mut">${usd(x.precio)} · 24 h ${pc(x.cambio_24h)}</div></div><button class="btn" id="cerrar">Cerrar ✕</button></div>
    <div class="banner ${clase}"><div class="l">Estado</div><div class="v">${esc(estado)}</div>
    ${p ? `<div class="sm">Entrada ${usd(p.entrada)} · ${p.stop ? 'stop ' + usd(p.stop) : 'sale si se rompe la tendencia diaria'}</div>` : ''}</div>
    <div class="grid">
      <div class="kv"><span>Tendencia diaria</span><b>${esc(x.tendencia)}</b></div>
      <div class="kv"><span>Frente al máx. 55 d</span><b>${pc(x.dist_max55)}</b></div>
      <div class="kv"><span>Máx. 55 d / mín. 20 d</span><b>${usd(x.max55)} / ${usd(x.min20)}</b></div>
      <div class="kv"><span>ATR diario</span><b>${x.atr_pct != null ? esn(x.atr_pct * 100, 1) + ' %' : '–'}</b></div>
      <div class="kv"><span>Spread Revolut X</span><b>${x.spread != null ? esn(x.spread * 100, 2) + ' %' : '–'}</b></div>
      <div class="kv"><span>Volumen 24 h Revolut X</span><b>${big(x.vol_usd)}</b></div>
    </div>
    <h3>Gráfica diaria (120 días)</h3>${grafica(x.grafica)}
    <div class="row" style="margin-top:10px">
      <a class="btn" target="_blank" rel="noopener" href="https://exchange.revolut.com/">Revolut X ↗</a>
      <a class="btn" target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=BINANCE:${t}USDT">TradingView ↗</a>
      <a class="btn" target="_blank" rel="noopener" href="https://news.google.com/search?q=${encodeURIComponent(t + ' crypto')}&hl=es">Noticias ↗</a></div>`;
  $('#det').classList.add('on');
  $('#cerrar').onclick = () => { $('#det').classList.remove('on'); activa = null; history.replaceState(null, '', location.pathname); };
  if (!silencioso) $('#det').scrollIntoView({behavior: 'smooth', block: 'start'});
}

document.addEventListener('click', e => {
  const tr = e.target.closest('[data-t]'); if (tr) { e.preventDefault(); return abrir(tr.dataset.t); }
  const th = e.target.closest('th[data-k]');
  if (th) { const k = th.dataset.k; asc = sortK === k ? !asc : k === 'ticker'; sortK = k; return universo(); }
  const tb = e.target.closest('[role=tab]');
  if (tb) document.querySelectorAll('[role=tab]').forEach(b => { b.setAttribute('aria-selected', b === tb); $('#tab-' + b.dataset.tab).hidden = b !== tb; });
});
$('#q').oninput = () => D && universo();
cargar(); setInterval(cargar, 5 * 60 * 1000);
</script>
</body>
</html>
